<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flag to Flag — An Alternate History of Grand Prix Racing</title>
<meta name="description" content="A generated alternate history of Grand Prix racing, season by season, from 1950 onward.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0d0d'/%3E%3Cg fill='%23e6e4dd'%3E%3Crect x='3' y='2' width='3' height='3'/%3E%3Crect x='9' y='2' width='3' height='3'/%3E%3Crect x='6' y='5' width='3' height='3'/%3E%3Crect x='3' y='8' width='3' height='3'/%3E%3Crect x='9' y='8' width='3' height='3'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#0b0d0d">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <div>
      <h1>Flag to Flag</h1>
      <p class="brand-sub">An alternate history of Grand Prix racing</p>
    </div>
  </div>
  <div class="season-clock">
    <span id="clock-year">1950</span>
    <span class="clock-round" id="clock-round">Round 0 of 7</span>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="season" class="tab is-active">Season</button>
  <button data-view="drivers" class="tab">Drivers</button>
  <button data-view="teams" class="tab">Teams</button>
  <button data-view="history" class="tab">History</button>
</nav>

<main id="main" class="main"></main>

<div class="controls" id="controls">
  <button id="btn-next" class="btn btn-primary">Next race</button>
  <button id="btn-season" class="btn">Rest of season</button>
  <button id="btn-menu" class="btn btn-ghost" aria-label="Game menu">···</button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-inner">
    <h3>Game</h3>
    <button class="btn btn-wide" id="btn-save">Save game</button>
    <button class="btn btn-wide" id="btn-load">Load game</button>
    <button class="btn btn-wide btn-danger" id="btn-new">Start a new history</button>
    <button class="btn btn-wide btn-ghost" id="btn-close-sheet">Close</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/data-drivers.js"></script>
<script src="js/data-teams.js"></script>
<script src="js/data-circuits.js"></script>
<script src="js/engine.js"></script>
<script src="js/narrative.js"></script>
<script src="js/career.js"></script>
<script src="js/season.js"></script>
<script src="js/save.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
